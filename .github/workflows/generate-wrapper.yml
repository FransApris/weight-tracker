name: Generate Gradle Wrapper

on:
  workflow_dispatch: {}

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    name: Generate and commit Gradle wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Run Gradle wrapper task
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4
          arguments: wrapper

      - name: Commit generated wrapper files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: actions@github.com
          message: "chore: add gradle wrapper"
          add: |
            gradlew
            gradlew.bat
            gradle/wrapper/**
          push: true
